<div class="shell" [class.nav-open]="sidebarOpen">
  <button
    type="button"
    class="menu-toggle"
    (click)="sidebarOpen = !sidebarOpen"
    [attr.aria-expanded]="sidebarOpen"
    aria-controls="app-sidebar"
  >
    {{ sidebarOpen ? 'Close menu' : 'Open menu' }}
  </button>

  @if (sidebarOpen) {
    <button type="button" class="backdrop" aria-label="Close menu" (click)="closeSidebar()"></button>
  }

  <aside id="app-sidebar" class="sidebar">
    <div class="brand">
      <span class="mark" aria-hidden="true">PIA</span>
      <div>
        <strong>Property Investment Analyst</strong>
        <span>Bengaluru apartments</span>
      </div>
    </div>

    <nav aria-label="Workspace">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeSidebar()"
      >
        Dashboard
      </a>
      <a routerLink="/" fragment="property-analysis" (click)="closeSidebar()">
        Analyse Property
      </a>
      <a routerLink="/compare" routerLinkActive="active" (click)="closeSidebar()">
        Compare Properties
      </a>
      <a routerLink="/market" routerLinkActive="active" (click)="closeSidebar()">
        Market Data
      </a>
      <a routerLink="/analyst" routerLinkActive="active" (click)="closeSidebar()">
        AI Analyst
      </a>
      <span class="nav-soon" title="Not available yet">
        Saved Analyses
        <em>Soon</em>
      </span>
      <span class="nav-soon" title="Not available yet">
        Settings
        <em>Soon</em>
      </span>
    </nav>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
